<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Account Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #0f172a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .app-card { background: #1e293b; transition: 0.3s; cursor: pointer; border: 1px solid #334155; }
        .app-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.5); border-color: #3b82f6; }
        .logo-icon { font-size: 40px; margin-bottom: 10px; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-10 border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-3xl font-bold text-blue-400"><i class="fa-solid fa-robot"></i> AI Account Hub</h1>
                <p class="text-slate-400 text-sm mt-1">User ID: {{ user_id }}</p>
            </div>
            <a href="/" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg text-sm font-bold shadow-lg transition">Back to Main Panel</a>
        </div>

        <h2 class="text-xl font-semibold mb-4 text-slate-300">Select Platform to Login</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-10">
            <!-- Instagram -->
            <div onclick="startLogin('instagram')" class="app-card rounded-xl p-6 text-center flex flex-col items-center">
                <i class="fa-brands fa-instagram text-pink-500 logo-icon"></i>
                <span class="font-bold">Instagram</span>
            </div>
            <!-- Facebook -->
            <div onclick="startLogin('facebook')" class="app-card rounded-xl p-6 text-center flex flex-col items-center">
                <i class="fa-brands fa-facebook text-blue-500 logo-icon"></i>
                <span class="font-bold">Facebook</span>
            </div>
            <!-- PayPal -->
            <div onclick="startLogin('paypal')" class="app-card rounded-xl p-6 text-center flex flex-col items-center">
                <i class="fa-brands fa-paypal text-blue-400 logo-icon"></i>
                <span class="font-bold">PayPal</span>
            </div>
            <!-- Telegram -->
            <div onclick="startLogin('telegram')" class="app-card rounded-xl p-6 text-center flex flex-col items-center">
                <i class="fa-brands fa-telegram text-sky-400 logo-icon"></i>
                <span class="font-bold">Telegram</span>
            </div>
            <!-- Google -->
            <div onclick="startLogin('google')" class="app-card rounded-xl p-6 text-center flex flex-col items-center">
                <i class="fa-brands fa-google text-red-400 logo-icon"></i>
                <span class="font-bold">Google</span>
            </div>
            <!-- X (Twitter) -->
            <div onclick="startLogin('x')" class="app-card rounded-xl p-6 text-center flex flex-col items-center">
                <i class="fa-brands fa-x-twitter text-white logo-icon"></i>
                <span class="font-bold">X (Twitter)</span>
            </div>
            <!-- GitHub -->
            <div onclick="startLogin('github')" class="app-card rounded-xl p-6 text-center flex flex-col items-center">
                <i class="fa-brands fa-github text-white logo-icon"></i>
                <span class="font-bold">GitHub</span>
            </div>
            <!-- Custom URL -->
            <div onclick="startLogin('custom')" class="app-card rounded-xl p-6 text-center flex flex-col items-center bg-slate-800 border-dashed border-2 border-slate-500">
                <i class="fa-solid fa-link text-slate-400 logo-icon"></i>
                <span class="font-bold text-slate-300">Custom URL</span>
            </div>
        </div>

        <h2 class="text-xl font-semibold mb-4 text-slate-300">My Logged-In Accounts</h2>
        <div id="accounts-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="text-slate-500 text-sm italic col-span-full">Loading accounts...</div>
        </div>
    </div>

    <script>
        const USER_ID = "{{ user_id }}";

        async function loadAccounts() {
            const box = document.getElementById('accounts-list');
            try {
                const res = await fetch(`/api/user_accounts/${USER_ID}`);
                const data = await res.json();
                if (data.accounts.length === 0) {
                    box.innerHTML = `<div class="text-slate-500 text-sm italic col-span-full">No accounts logged in yet. Click an app above to start.</div>`;
                    return;
                }
                box.innerHTML = data.accounts.map(acc => `
                    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex items-center justify-between">
                        <div>
                            <div class="font-bold text-lg text-white capitalize">${acc.platform}</div>
                            <div class="text-sm text-slate-400">${acc.phone}</div>
                        </div>
                        <span class="px-3 py-1 rounded-full text-xs font-bold ${acc.status === 'success' ? 'bg-green-900 text-green-300' : 'bg-red-900 text-red-300'}">
                            ${acc.status.toUpperCase()}
                        </span>
                    </div>
                `).join('');
            } catch (e) { console.error(e); }
        }

        function startLogin(platform) {
            // Yahan se Telegram bot ko command bhejne ka link banayenge
            // Abhi ke liye alert
            alert(`Open Telegram Bot and use: /login_${platform}`);
            // Actual implementation: bot ke deep link se open karega
        }

        loadAccounts();
    </script>
</body>
</html>
