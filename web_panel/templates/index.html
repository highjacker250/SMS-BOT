<!DOCTYPE html>
<html data-theme="jjk" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dark OTP Bot — AI SaaS Manager</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet"/>
<style>
    :root, [data-theme="jjk"] { --bg-base: #07040d; --bg-surface: #0e0919; --bg-card: rgba(23, 14, 41, 0.72); --border-subtle: rgba(139, 92, 246, 0.22); --primary: #8b5cf6; --accent: #38bdf8; --text-main: #f3f0ff; --text-muted: #9d8ec2; }
    body { background-color: var(--bg-base); color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif; background-image: radial-gradient(circle at 15% 15%, rgba(139,92,246,0.15) 0%, transparent 40%), radial-gradient(circle at 85% 85%, rgba(56,189,248,0.15) 0%, transparent 40%); }
    .theme-card { background-color: var(--bg-card); border: 1px solid var(--border-subtle); backdrop-filter: blur(16px); }
    .theme-card:hover { border-color: var(--accent); }
</style>
</head>
<body class="min-h-screen flex flex-col overflow-hidden">

<header class="h-16 w-full border-b border-[var(--border-subtle)] bg-[var(--bg-surface)]/80 backdrop-blur-xl flex items-center justify-between px-5">
    <span class="font-bold text-lg" style="color: var(--accent);">DARK OTP BOT</span>
    <a href="/telegram" class="px-4 py-2 rounded-lg bg-[var(--primary)] text-white text-xs font-bold">Open Telegram UI</a>
</header>

<main class="flex-1 overflow-y-auto p-6 space-y-6">

    <!-- Hunting Control -->
    <div class="theme-card rounded-2xl p-6 flex items-center justify-between">
        <div>
            <h2 class="text-xl font-bold" style="color: var(--accent);">AI GHATAK HUNTER</h2>
            <p class="text-xs text-gray-400 mt-1" id="hunting-status">Loading status...</p>
        </div>
        <button id="hunting-btn" onclick="toggleHunting()" class="px-8 py-3 rounded-xl font-bold text-white bg-red-600 text-lg">CHECKING...</button>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="theme-card rounded-2xl p-5">
            <span class="text-xs text-gray-400 uppercase">Active Accounts</span>
            <div class="text-3xl font-black mt-2" id="accounts-count">0</div>
        </div>
        <div class="theme-card rounded-2xl p-5">
            <span class="text-xs text-gray-400 uppercase">Working Proxies</span>
            <div class="text-3xl font-black mt-2" id="proxies-count">0</div>
        </div>
    </div>

    <!-- Live Status -->
    <div class="theme-card rounded-2xl p-6">
        <h3 class="text-sm font-bold mb-3" style="color: var(--accent);">AI LIVE ACTIVITY</h3>
        <p class="text-xs font-mono" id="live-detail">Waiting for data...</p>
    </div>

</main>

<script>
    let huntingState = false;

    async function fetchHuntingState() {
        try {
            const res = await fetch('/api/hunting_status');
            const data = await res.json();
            huntingState = data.enabled;
            const btn = document.getElementById('hunting-btn');
            const status = document.getElementById('hunting-status');
            if (huntingState) {
                btn.textContent = 'HUNTING ON';
                btn.className = 'px-8 py-3 rounded-xl font-bold text-white bg-green-600 text-lg';
                status.textContent = '✅ AI is hunting all devices non-stop!';
            } else {
                btn.textContent = 'HUNTING OFF';
                btn.className = 'px-8 py-3 rounded-xl font-bold text-white bg-red-600 text-lg';
                status.textContent = '⏸ AI is sleeping. Turn ON to start.';
            }
        } catch (e) { console.error(e); }
    }

    async function toggleHunting() {
        await fetch('/api/toggle_hunting', { method: 'POST' });
        fetchHuntingState();
    }

    async function fetchData() {
        try {
            const accountsRes = await fetch('/api/get_accounts');
            const accountsData = await accountsRes.json();
            if (accountsData.status === 'success') {
                document.getElementById('accounts-count').textContent = accountsData.accounts.length;
            }

            const healthRes = await fetch('/api/health');
            const healthData = await healthRes.json();
            document.getElementById('proxies-count').textContent = healthData.working_proxies;
            document.getElementById('live-detail').textContent = `${healthData.task} — ${healthData.detail}`;
        } catch (e) { console.error(e); }
    }

    document.addEventListener('DOMContentLoaded', () => {
        fetchHuntingState();
        fetchData();
        setInterval(fetchData, 5000);
    });
</script>
</body>
</html>
