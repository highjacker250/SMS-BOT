<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Telegram Desktop — Anime Cyber Dark Edition</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- FontAwesome 6 -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Cinzel:wght@600;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
            anime: ['"Orbitron"', 'sans-serif'],
            gothic: ['"Cinzel"', 'serif'],
          },
          colors: {
            tele: {
              rail: '#090d14',
              sidebar: '#0e1622',
              card: '#15202e',
              chatbg: '#0a0f18',
              hover: '#192638',
              active: '#1c2d42',
              neonCyan: '#00f0ff',
              neonOrange: '#ff6b00',
              neonPink: '#ff007f',
              neonPurple: '#a855f7',
              bubbleIn: '#162231',
              border: '#1f2e42',
              muted: '#7a8eab',
            }
          },
          boxShadow: {
            'glow-cyan': '0 0 18px -2px rgba(0, 240, 255, 0.45)',
            'glow-orange': '0 0 20px -2px rgba(255, 107, 0, 0.45)',
            'glow-purple': '0 0 20px -2px rgba(168, 85, 247, 0.45)',
            'glow-pink': '0 0 20px -2px rgba(255, 0, 127, 0.45)',
          },
          animation: {
            'pulse-fast': 'pulse 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 3s ease-in-out infinite',
            'scanline': 'scanline 8s linear infinite',
            'fade-in': 'fadeIn 0.3s ease-out forwards',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-4px)' },
            },
            scanline: {
              '0%': { transform: 'translateY(-100%)' },
              '100%': { transform: 'translateY(1000%)' },
            },
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>
<style>
    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(31, 46, 66, 0.7); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0, 240, 255, 0.5); }

    /* Waveform pulsing bars */
    .wave-bar { transition: height 0.15s ease, background-color 0.2s ease; }
    .playing .wave-bar:nth-child(2n) { animation: wavePulse 0.7s infinite alternate ease-in-out; }
    .playing .wave-bar:nth-child(3n) { animation: wavePulse 0.5s infinite 0.15s alternate ease-in-out; }
    .playing .wave-bar:nth-child(4n) { animation: wavePulse 0.8s infinite 0.25s alternate ease-in-out; }
    @keyframes wavePulse {
        0% { transform: scaleY(0.4); opacity: 0.6; }
        100% { transform: scaleY(1.4); opacity: 1; filter: drop-shadow(0 0 4px #00f0ff); }
    }

    /* Anime Wallpaper Matrix + Neon Grid overlay */
    .anime-wallpaper {
        background-color: #080c14;
        background-image: radial-gradient(circle at 80% 20%, rgba(255, 107, 0, 0.08) 0%, transparent 40%), 
                          radial-gradient(circle at 20% 80%, rgba(0, 240, 255, 0.08) 0%, transparent 50%), 
                          radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.05) 0%, transparent 60%);
        background-size: cover;
        background-position: center;
    }
    .cyber-grid {
        background-size: 40px 40px;
        background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px), 
                          linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    }

    /* Active theme glow */
    .theme-cyber { --accent-color: #00f0ff; --accent-glow: rgba(0,240,255,0.4); }
    .theme-jjk { --accent-color: #a855f7; --accent-glow: rgba(168,85,247,0.4); }
    .theme-deathnote { --accent-color: #e11d48; --accent-glow: rgba(225,29,72,0.4); }

    .neon-text {
        color: var(--accent-color);
        text-shadow: 0 0 10px var(--accent-glow);
    }
    .neon-border {
        border-color: var(--accent-color);
        box-shadow: 0 0 15px var(--accent-glow);
    }
</style>
</head>
<body class="theme-cyber bg-tele-rail text-slate-100 font-sans antialiased overflow-hidden h-screen w-screen select-none flex">

<!-- BACKGROUND OVERLAY -->
<div id="theme-bg-overlay" class="fixed inset-0 pointer-events-none opacity-10 bg-cover bg-center transition-all duration-1000" style="background-image: url('https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=1920&auto=format&fit=crop');"></div>

<!-- ========================================================================= -->
<!-- 1. FAR LEFT NARROW SIDEBAR (70px Rail) -->
<!-- ========================================================================= -->
<aside class="w-[70px] flex-shrink-0 h-full bg-[#080d15] border-r border-tele-border/60 flex flex-col items-center justify-between py-4 z-40 relative">
    <div class="flex flex-col items-center gap-6 w-full">
        <button class="w-11 h-11 rounded-xl bg-gradient-to-br from-tele-card to-[#121c2b] border border-tele-border/70 flex items-center justify-center text-slate-300 hover:text-[var(--accent-color)] transition-all group" title="Menu">
            <i class="fa-solid fa-bars-staggered text-lg group-hover:scale-110 transition-transform"></i>
        </button>
        
        <nav class="flex flex-col items-center gap-3 w-full px-2">
            <!-- Chats (Active) -->
            <button class="relative w-12 h-12 rounded-xl bg-gradient-to-br from-[#1a2b40] to-[#121e2d] neon-text neon-border flex items-center justify-center group transition-all" onclick="switchRailTab('chats')">
                <i class="fa-solid fa-comments text-lg group-hover:scale-110 transition-transform"></i>
                <span class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-tele-neonOrange text-white text-[10px] font-bold flex items-center justify-center border-2 border-[#080d15] shadow-glow-orange">9</span>
            </button>
            
            <!-- Contacts -->
            <button class="relative w-12 h-12 rounded-xl text-slate-400 hover:text-white hover:bg-tele-hover/70 border border-transparent flex items-center justify-center group transition-all" onclick="switchRailTab('contacts')">
                <i class="fa-solid fa-address-book text-lg group-hover:scale-110 transition-transform"></i>
            </button>
            
            <!-- Calls -->
            <button class="relative w-12 h-12 rounded-xl text-slate-400 hover:text-white hover:bg-tele-hover/70 border border-transparent flex items-center justify-center group transition-all" onclick="switchRailTab('calls')">
                <i class="fa-solid fa-phone text-lg group-hover:scale-110 transition-transform"></i>
            </button>
            
            <!-- Bots -->
            <button class="relative w-12 h-12 rounded-xl text-tele-neonPink/80 hover:text-tele-neonPink hover:bg-tele-hover/70 border border-transparent flex items-center justify-center group transition-all" onclick="switchRailTab('bots')">
                <i class="fa-solid fa-robot text-lg group-hover:scale-110 transition-transform"></i>
            </button>
            
            <!-- Saved Messages -->
            <button class="relative w-12 h-12 rounded-xl text-slate-400 hover:text-white hover:bg-tele-hover/70 border border-transparent flex items-center justify-center group transition-all" onclick="showToast('Saved Messages Opened')">
                <i class="fa-solid fa-bookmark text-lg group-hover:scale-110 transition-transform"></i>
            </button>
            
            <!-- Settings -->
            <button class="relative w-12 h-12 rounded-xl text-slate-400 hover:text-[var(--accent-color)] hover:bg-tele-hover/70 border border-transparent flex items-center justify-center group transition-all" onclick="openSettingsModal()">
                <i class="fa-solid fa-gear text-lg group-hover:rotate-90 transition-transform duration-300"></i>
            </button>
        </nav>
    </div>
    
    <!-- Profile Avatar Bottom -->
    <div class="flex flex-col items-center gap-3 w-full px-2">
        <button class="w-10 h-10 rounded-xl bg-purple-950/40 border border-purple-500/30 text-purple-300 hover:text-white hover:border-purple-400 flex items-center justify-center text-xs transition-all" onclick="cycleAesthetic()" title="Switch Theme">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
        </button>
        <div class="relative group cursor-pointer" onclick="openSettingsModal()">
            <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-tele-neonOrange via-pink-600 to-[var(--accent-color)] p-[2px] shadow-glow-orange hover:scale-105 transition-transform">
                <div class="w-full h-full rounded-[14px] bg-[#0c1420] flex items-center justify-center font-anime text-sm font-bold text-white tracking-wider">SR</div>
            </div>
            <span class="absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full bg-emerald-400 border-2 border-[#080d15]"></span>
        </div>
    </div>
</aside>

<!-- ========================================================================= -->
<!-- 2. MIDDLE COLUMN: CHAT LIST (320px) -->
<!-- ========================================================================= -->
<section class="w-[320px] flex-shrink-0 h-full bg-tele-sidebar border-r border-tele-border/80 flex flex-col relative z-30">
    <!-- Header -->
    <div class="p-3.5 pb-2 border-b border-tele-border/60 flex flex-col gap-2.5">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="font-anime text-sm font-extrabold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-[var(--accent-color)] to-white">TELEGRAM</span>
            </div>
            <div class="flex items-center gap-1.5 text-slate-400 text-xs font-mono">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="text-[11px] text-emerald-400 font-medium">WARP CONNECTED</span>
            </div>
        </div>
        <!-- Search -->
        <div class="relative flex items-center">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 text-xs text-tele-muted"></i>
            <input class="w-full bg-[#131d2b] border border-tele-border/70 text-slate-200 placeholder:text-tele-muted/70 text-xs rounded-xl pl-9 pr-8 py-2.5 focus:outline-none focus:border-[var(--accent-color)] transition-all" id="chat-search-input" oninput="handleSearch(this.value)" placeholder="Search chats, contacts..." type="text"/>
        </div>
    </div>

    <!-- Folders -->
    <div class="px-3 pt-2.5 pb-2 flex items-center gap-1.5 overflow-x-auto border-b border-tele-border/40">
        <button class="px-3 py-1.5 rounded-lg text-xs font-medium bg-[var(--accent-color)] text-slate-950 shadow-glow-cyan font-mono transition-all" onclick="filterFolder('all')">All Chats</button>
        <button class="px-3 py-1.5 rounded-lg text-xs font-medium bg-[#121c2a] text-slate-400 border border-tele-border/60 transition-all" onclick="filterFolder('anime')">ANIME HUBS</button>
        <button class="px-3 py-1.5 rounded-lg text-xs font-medium bg-[#121c2a] text-slate-400 border border-tele-border/60 transition-all" onclick="filterFolder('bots')">OTP RELAYS</button>
    </div>

    <!-- Chat Items Container (JS will populate) -->
    <div class="flex-1 overflow-y-auto px-2 py-2 space-y-1" id="chat-list-container">
        <!-- Loading State -->
        <div class="flex items-center justify-center h-full text-xs text-tele-muted font-mono">
            <i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Loading real accounts...
        </div>
    </div>

    <!-- FAB -->
    <div class="absolute bottom-5 right-4 z-40">
        <button class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-tele-neonOrange to-amber-400 text-white shadow-glow-orange hover:scale-105 transition-all flex items-center justify-center" onclick="showToast('New Chat Feature Coming Soon')">
            <i class="fa-solid fa-pen-nib text-lg"></i>
        </button>
    </div>
</section>

<!-- ========================================================================= -->
<!-- 3. RIGHT MAIN PANEL: CHAT VIEW (flex-1) -->
<!-- ========================================================================= -->
<main class="flex-1 h-full flex flex-col bg-tele-chatbg relative anime-wallpaper cyber-grid overflow-hidden">
    <!-- Header -->
    <header class="h-16 px-6 bg-[#0c1420]/90 backdrop-blur-md border-b border-tele-border/80 flex items-center justify-between z-30 flex-shrink-0">
        <div class="flex items-center gap-3.5">
            <div class="relative" id="header-avatar-wrap">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-600 to-blue-500 flex items-center justify-center font-anime font-bold text-white text-sm" id="header-avatar">DO</div>
                <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full bg-emerald-400 border-2 border-[#0c1420]" id="header-status-dot"></span>
            </div>
            <div class="flex flex-col">
                <div class="flex items-center gap-2">
                    <h2 class="font-bold text-slate-100 text-sm tracking-wide" id="header-title">Dark OTP Relay Bot</h2>
                    <i class="fa-solid fa-shield-halved text-xs text-[var(--accent-color)]"></i>
                </div>
                <p class="text-xs text-tele-muted font-medium flex items-center gap-1.5" id="header-subtitle">
                    <span class="text-emerald-400 font-mono text-[11px] font-bold">● Online</span>
                </p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button class="px-3 py-1.5 rounded-lg bg-gradient-to-r from-tele-neonOrange/20 to-orange-500/20 hover:from-tele-neonOrange border border-tele-neonOrange/50 text-tele-neonOrange text-xs font-mono font-bold transition-all flex items-center gap-1.5" onclick="simulateIncomingOTP()">
                <i class="fa-solid fa-bolt"></i> Simulate OTP
            </button>
            <button class="w-9 h-9 rounded-lg bg-[#131d2b] hover:bg-tele-hover text-slate-300 flex items-center justify-center" onclick="showToast('Search opened')"><i class="fa-solid fa-magnifying-glass text-xs"></i></button>
            <button class="w-9 h-9 rounded-lg bg-[#131d2b] hover:bg-tele-hover text-slate-300 flex items-center justify-center" onclick="showToast('Options opened')"><i class="fa-solid fa-ellipsis-vertical text-xs"></i></button>
        </div>
    </header>

    <!-- Chat History -->
    <div class="flex-1 overflow-y-auto px-6 py-5 space-y-4 relative z-10" id="messages-scroll-area">
        <div class="flex items-center justify-center my-3">
            <div class="px-4 py-1 rounded-full bg-[#0d1624]/90 text-[11px] font-mono text-tele-muted">Today, October 24</div>
        </div>

        <!-- Default Welcome -->
        <div class="flex items-end gap-2.5 max-w-2xl">
            <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-cyan-600 to-blue-500 flex items-center justify-center text-[10px] font-anime font-bold text-white">DO</div>
            <div class="p-3.5 rounded-2xl rounded-bl-sm bg-tele-bubbleIn border border-tele-border text-slate-100 text-xs shadow-md">
                <p>Welcome Root Commander. Select a chat from the left or wait for incoming OTPs.</p>
            </div>
        </div>
    </div>

    <!-- Input Bar -->
    <footer class="p-3.5 bg-[#0c1421]/95 border-t border-tele-border/80 flex items-center gap-3 z-30">
        <button class="px-3 py-2 rounded-xl bg-[#142030] hover:bg-[#1a2c42] border border-tele-border text-slate-300 text-xs font-mono transition-all" onclick="showToast('Bot Menu')">
            <i class="fa-solid fa-terminal text-[var(--accent-color)]"></i> Menu
        </button>
        <div class="flex-1 relative flex items-center">
            <input class="w-full bg-[#131f2f] border border-tele-border/80 text-slate-100 placeholder:text-tele-muted text-xs rounded-xl pl-4 pr-12 py-3 focus:outline-none focus:border-[var(--accent-color)]" id="message-input" onkeydown="if(event.key === 'Enter') sendMessage()" placeholder="Write a message..." type="text"/>
            <button class="absolute right-3 text-slate-400 hover:text-[var(--accent-color)]" onclick="showToast('Emoji Picker')"><i class="fa-regular fa-face-smile text-base"></i></button>
        </div>
        <button class="w-11 h-11 rounded-xl bg-gradient-to-tr from-[var(--accent-color)] to-blue-600 text-slate-950 flex items-center justify-center shadow-glow-cyan hover:scale-105 transition-all" onclick="sendMessage()">
            <i class="fa-solid fa-paper-plane text-sm ml-0.5"></i>
        </button>
    </footer>
</main>

<!-- ========================================================================= -->
<!-- 4. SETTINGS MODAL (Themes) -->
<!-- ========================================================================= -->
<div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4" id="settings-modal">
    <div class="w-full max-w-md rounded-2xl bg-[#0c1421] border border-[var(--accent-color)]/40 shadow-glow-cyan overflow-hidden flex flex-col">
        <div class="p-4 border-b border-tele-border/70 flex justify-between items-center bg-[#0e1726]">
            <h3 class="font-anime font-bold text-sm text-white">ANIME THEMES</h3>
            <button class="text-slate-400 hover:text-white" onclick="closeSettingsModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="p-5 space-y-4">
            <div class="grid grid-cols-3 gap-2.5">
                <button class="p-3 rounded-xl bg-[#121d2d] border border-cyan-500/50 flex flex-col items-center gap-1 hover:bg-[#1a2b40]" onclick="applyAnimeTheme('cyberpunk')">
                    <span class="font-bold text-cyan-400 text-xs">Sung Jin-Woo</span>
                    <span class="text-[9px] text-slate-400">Solo Leveling</span>
                </button>
                <button class="p-3 rounded-xl bg-[#121d2d] border border-rose-500/50 flex flex-col items-center gap-1 hover:bg-[#1a2b40]" onclick="applyAnimeTheme('deathnote')">
                    <span class="font-bold text-rose-400 text-xs">Light Yagami</span>
                    <span class="text-[9px] text-slate-400">Death Note</span>
                </button>
                <button class="p-3 rounded-xl bg-[#121d2d] border border-purple-500/50 flex flex-col items-center gap-1 hover:bg-[#1a2b40]" onclick="applyAnimeTheme('jjk')">
                    <span class="font-bold text-purple-400 text-xs">Satoru Gojo</span>
                    <span class="text-[9px] text-slate-400">Jujutsu Kaisen</span>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Toast Notification -->
<div class="fixed top-5 right-5 z-50 hidden transition-all duration-300 transform translate-y-[-20px] opacity-0" id="toast-notify">
    <div class="px-4 py-2.5 rounded-xl bg-[#0e1a2b] border border-[var(--accent-color)] text-slate-100 shadow-glow-cyan flex items-center gap-2.5 text-xs font-mono">
        <i class="fa-solid fa-circle-check text-[var(--accent-color)]"></i>
        <span id="toast-text">Done</span>
    </div>
</div>

<!-- ========================================================================= -->
<!-- JAVASCRIPT LOGIC -->
<!-- ========================================================================= -->
<script>
    let currentChatId = null;
    let realAccounts = [];

    // Fetch Real Accounts from Python Backend
    async function fetchRealAccounts() {
        try {
            const response = await fetch('/api/get_accounts');
            const data = await response.json();
            
            if (data.status === 'success' && data.accounts.length > 0) {
                realAccounts = data.accounts;
                renderRealChatList();
                // Auto select first chat
                if (realAccounts.length > 0) {
                    selectRealAccount(realAccounts[0].phone);
                }
            } else {
                document.getElementById('chat-list-container').innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-tele-muted text-xs p-4 text-center">
                        <i class="fa-solid fa-user-slash text-3xl mb-3 opacity-50"></i>
                        <p>No accounts found.</p>
                        <p class="mt-1 opacity-70">Use /tglogin in Telegram Bot to add an account.</p>
                    </div>
                `;
            }
        } catch (error) {
            console.error("API Error:", error);
            document.getElementById('chat-list-container').innerHTML = `<div class="p-4 text-center text-rose-400 text-xs">Failed to connect to Backend.</div>`;
        }
    }

    // Render Real Accounts in Chat List
    function renderRealChatList() {
        const container = document.getElementById('chat-list-container');
        container.innerHTML = '';
        
        realAccounts.forEach((acc, index) => {
            const isActive = currentChatId === acc.phone;
            const statusColor = acc.status === 'active' ? 'bg-emerald-400' : 'bg-amber-400';
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            const item = document.createElement('div');
            item.className = `p-2.5 rounded-xl cursor-pointer transition-all duration-200 flex items-center gap-3 relative group ${
                isActive 
                    ? 'bg-[#1a293d] border border-[var(--accent-color)] shadow-glow-cyan' 
                    : 'bg-[#111a27]/60 hover:bg-[#162334] border border-transparent hover:border-tele-border/80'
            }`;
            
            item.onclick = () => selectRealAccount(acc.phone);

            item.innerHTML = `
                <div class="relative flex-shrink-0">
                    <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-cyan-600 to-blue-500 border border-tele-border/50 flex items-center justify-center font-anime font-bold text-white text-xs">
                        ${acc.phone.slice(-2)}
                    </div>
                    <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full ${statusColor} border-2 border-tele-sidebar"></span>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between mb-0.5">
                        <span class="font-bold text-xs truncate ${isActive ? 'text-[var(--accent-color)]' : 'text-slate-100'}">
                            +${acc.phone}
                        </span>
                        <span class="text-[10px] font-mono text-tele-muted">${time}</span>
                    </div>
                    <p class="text-[11px] text-slate-400 truncate pr-2 font-sans">${acc.ai_task}</p>
                </div>
            `;
            container.appendChild(item);
        });
    }

    // Select Real Account
    function selectRealAccount(phone) {
        currentChatId = phone;
        const acc = realAccounts.find(a => a.phone === phone);
        if (!acc) return;

        renderRealChatList(); // Re-render to show active state

        // Update Header
        document.getElementById('header-title').textContent = `+${acc.phone}`;
        document.getElementById('header-subtitle').innerHTML = `
            <span class="${acc.status === 'active' ? 'text-emerald-400' : 'text-amber-400'} font-mono text-[11px] font-bold">● ${acc.status.toUpperCase()}</span>
            <span class="text-slate-500">•</span>
            <span class="text-[11px] text-slate-400">Session: ${acc.session}</span>
        `;
        document.getElementById('header-avatar').textContent = acc.phone.slice(-2);

        // Update Messages Area (Show placeholder for real account)
        const messagesArea = document.getElementById('messages-scroll-area');
        messagesArea.innerHTML = `
            <div class="flex items-center justify-center my-3">
                <div class="px-4 py-1 rounded-full bg-[#0d1624]/90 text-[11px] font-mono text-tele-muted">Account Selected: +${acc.phone}</div>
            </div>
            <div class="flex items-end gap-2.5 max-w-2xl">
                <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-cyan-600 to-blue-500 flex items-center justify-center text-[10px] font-anime font-bold text-white">${acc.phone.slice(-2)}</div>
                <div class="p-3.5 rounded-2xl rounded-bl-sm bg-tele-bubbleIn border border-tele-border text-slate-100 text-xs shadow-md">
                    <p>Session synced. Waiting for incoming OTPs on this number...</p>
                </div>
            </div>
        `;
    }

    // Send Message (Dummy for now)
    function sendMessage() {
        const input = document.getElementById('message-input');
        const text = input.value.trim();
        if (!text) return;

        const container = document.getElementById('messages-scroll-area');
        const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const outBubble = document.createElement('div');
        outBubble.className = "flex items-end justify-end gap-2.5 max-w-2xl ml-auto animate-fade-in";
        outBubble.innerHTML = `
            <div class="p-3.5 rounded-2xl rounded-br-sm bg-gradient-to-r from-[#203c5e] to-[#1a304b] border border-[var(--accent-color)]/40 text-slate-100 text-xs">
                <p>${escapeHtml(text)}</p>
                <div class="flex items-center justify-end gap-1.5 mt-1.5 text-[10px] text-cyan-300/80 font-mono">
                    <span>${timeStr}</span>
                    <i class="fa-solid fa-check text-slate-400"></i>
                </div>
            </div>
        `;
        container.appendChild(outBubble);
        input.value = '';
        container.scrollTop = container.scrollHeight;
    }

    // Simulate OTP (Dummy UI test)
    function simulateIncomingOTP() {
        const container = document.getElementById('messages-scroll-area');
        const pin1 = Math.floor(100 + Math.random() * 900);
        const pin2 = Math.floor(100 + Math.random() * 900);
        const randomCode = `${pin1} - ${pin2}`;
        const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const otpCard = document.createElement('div');
        otpCard.className = "max-w-lg mr-auto animate-fade-in";
        otpCard.innerHTML = `
            <div class="p-4 rounded-2xl bg-[#0e1724]/95 border border-[var(--accent-color)]/60 shadow-glow-cyan backdrop-blur-md space-y-3">
                <div class="flex items-center justify-between pb-2 border-b border-tele-border/60">
                    <span class="text-xs font-mono font-bold text-emerald-400"><i class="fa-solid fa-bolt text-yellow-400"></i> OTP INTERCEPTED</span>
                    <span class="text-[10px] font-mono text-tele-muted">ID: #${Math.floor(1000 + Math.random() * 9000)}</span>
                </div>
                <div class="p-3.5 rounded-xl bg-gradient-to-r from-[#122336] to-[#0c1826] border border-[var(--accent-color)]/50 flex items-center justify-between">
                    <div>
                        <span class="text-[9px] font-mono text-cyan-300 uppercase">One-Time Password</span>
                        <span class="text-2xl font-mono font-extrabold text-emerald-400 tracking-[0.25em]">${randomCode}</span>
                    </div>
                    <button onclick="copyOTPCode('${pin1}${pin2}')" class="px-3.5 py-2 rounded-lg bg-emerald-500 text-slate-950 font-bold text-xs font-mono">Copy</button>
                </div>
                <div class="flex justify-between text-[10px] text-tele-muted font-mono">
                    <span class="text-emerald-400">Relayed in 0.19s</span>
                    <span>${timeStr}</span>
                </div>
            </div>
        `;
        container.appendChild(otpCard);
        container.scrollTop = container.scrollHeight;
        showToast(`New OTP Intercepted: ${randomCode}`);
    }

    // Copy OTP Helper
    function copyOTPCode(code) {
        navigator.clipboard.writeText(code).then(() => {
            showToast(`Copied OTP ${code} to clipboard!`);
        });
    }

    // Toast Notifications
    function showToast(msg) {
        const toast = document.getElementById('toast-notify');
        const text = document.getElementById('toast-text');
        text.textContent = msg;
        toast.classList.remove('hidden', 'translate-y-[-20px]', 'opacity-0');
        
        setTimeout(() => {
            toast.classList.add('translate-y-[-20px]', 'opacity-0');
            setTimeout(() => toast.classList.add('hidden'), 300);
        }, 2500);
    }

    // Theme Functionality
    function openSettingsModal() { document.getElementById('settings-modal').classList.remove('hidden'); }
    function closeSettingsModal() { document.getElementById('settings-modal').classList.add('hidden'); }

    function applyAnimeTheme(theme) {
        const body = document.body;
        const bgOverlay = document.getElementById('theme-bg-overlay');
        
        body.classList.remove('theme-cyber', 'theme-jjk', 'theme-deathnote');
        
        if (theme === 'jjk') {
            body.classList.add('theme-jjk');
            bgOverlay.style.backgroundImage = "url('https://images.unsplash.com/photo-1629898362010-567a435f0a1c?q=80&w=1920&auto=format&fit=crop')";
            showToast("Gojo's Cursed Energy Activated");
        } else if (theme === 'deathnote') {
            body.classList.add('theme-deathnote');
            bgOverlay.style.backgroundImage = "url('https://images.unsplash.com/photo-1513116476489-7635e79feb27?q=80&w=1920&auto=format&fit=crop')";
            showToast("Shinigami Eyes Activated");
        } else {
            body.classList.add('theme-cyber');
            bgOverlay.style.backgroundImage = "url('https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=1920&auto=format&fit=crop')";
            showToast("Monarch System Initialized");
        }
        closeSettingsModal();
    }

    function cycleAesthetic() {
        const themes = ['cyberpunk', 'jjk', 'deathnote'];
        const next = themes[Math.floor(Math.random() * themes.length)];
        applyAnimeTheme(next);
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Init
    window.addEventListener('DOMContentLoaded', () => {
        fetchRealAccounts();
    });
</script>
</body>
</html>
