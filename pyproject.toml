[project]
name = "sms-bot"
version = "2.0.0"
description = "Telegram OTP Bot with Web Panel and Browser Automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram==3.13.0",
    "aiohttp>=3.9",
    "aiohttp-socks>=0.10.1",
    "supabase>=2.0.0",
    "groq>=0.9.0",
    "pyrogram>=2.0.106",
    "TgCrypto>=1.2.5",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "jinja2>=3.1.0",
    "pysocks>=1.7.1",
    "playwright>=1.40.0",
    "tldextract>=5.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-aiohttp>=3.9.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100
indent-style = "space"
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default args
    "SIM103", # return bool instead of if/else
]
per-file-ignores = {}

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true

[tool.mypy.overrides]
module = [
    "aiogram*",
    "aiohttp*",
    "supabase*",
    "groq*",
    "pyrogram*",
    "fastapi*",
    "uvicorn*",
    "playwright*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "web_panel/templates/*",
    "main.py",
    "start.sh",
    "Dockerfile",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]